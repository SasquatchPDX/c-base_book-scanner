rule_files:
  - /etc/prometheus/rules/book-scanner-alerts.yml

scrape_configs:
  - job_name: book-scanner
    scheme: https
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/book-scanner-metrics-token
    static_configs:
      - targets:
          - library.example.org
        labels:
          service: ebook-library
