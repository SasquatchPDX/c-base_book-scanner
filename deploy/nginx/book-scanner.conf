upstream book_scanner_asgi {
    server book-scanner-web:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 150m;

    # Plain HTTP must never carry the scanner device API (its Bearer key);
    # the TLS 1.3 server in serif-lan-tls.conf serves it.
    location /api/scanner/ {
        return 403;
    }

    location /static/ {
        alias /srv/book-scanner/static/;
        access_log off;
        add_header Cache-Control "public, max-age=60";
    }

    # Cover thumbnails (#28). Django checks the session and the member's permissions on
    # /library/covers/<sha256>/<size>.webp, then answers with
    # X-Accel-Redirect: /_protected/cover-thumbnails/<path> when
    # BOOK_SCANNER_COVER_THUMBNAIL_ACCEL_PREFIX=/_protected/cover-thumbnails/ is set.
    # nginx keeps Django's "Cache-Control: private, max-age=31536000, immutable".
    # `internal` makes this location unreachable from outside. The alias must be the
    # directory of the `cover-thumbnails` storage location
    # (BOOK_SCANNER_COVER_THUMBNAIL_ROOT).
    location /_protected/cover-thumbnails/ {
        internal;
        alias /var/lib/book-scanner/cover-thumbnails/;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    # ScanTailor previews, working images and page thumbnails (#195). Django checks
    # the session, then answers with X-Accel-Redirect: /_protected/scan-artifacts/<path>
    # when BOOK_SCANNER_SCAN_ARTIFACT_ACCEL_PREFIX=/_protected/scan-artifacts/ is set.
    # URLs carrying the artifact's token (?v=...) keep Django's
    # "Cache-Control: private, max-age=31536000, immutable". The alias must be
    # <BOOK_SCANNER_APP_DATA_DIR>/scan-artifacts/.
    location /_protected/scan-artifacts/ {
        internal;
        alias /var/lib/book-scanner/scan-artifacts/;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    # Unbuffered ScanTailor event stream. Job IDs are UUIDs (web jobs) or
    # YYYYMMDDTHHMMSSZ[-N] (scanner jobs); quoted because of the {n} quantifiers.
    location ~ "^/scan/jobs/(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[0-9]{8}T[0-9]{6}Z(?:-[1-9][0-9]{0,3})?)/workspace/events/$" {
        proxy_pass http://book_scanner_asgi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_pass_header X-Accel-Buffering;
    }

    location / {
        proxy_pass http://book_scanner_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
