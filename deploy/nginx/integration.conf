upstream book_scanner_asgi {
    server host.docker.internal:18081;
    keepalive 4;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Mirrors book-scanner.conf: no scanner device API over plain HTTP.
    location /api/scanner/ {
        return 403;
    }

    location /static/ {
        alias /srv/book-scanner/static/;
        access_log off;
        add_header Cache-Control "public, max-age=60";
    }

    # Unbuffered ScanTailor event stream. Job IDs are UUIDs (web jobs) or
    # YYYYMMDDTHHMMSSZ[-N] (scanner jobs); quoted because of the {n} quantifiers.
    location ~ "^/scan/jobs/(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[0-9]{8}T[0-9]{6}Z(?:-[1-9][0-9]{0,3})?)/workspace/events/$" {
        proxy_pass http://book_scanner_asgi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_pass_header X-Accel-Buffering;
    }

    location / {
        proxy_pass http://book_scanner_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
