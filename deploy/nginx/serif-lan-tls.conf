# TLS 1.3, LAN-only front end for the libreflip scanner device API
# (/api/scanner/v1/) and the member portal on the same host name.
#
# Contract: libreflip/serif docs/sans-serif-interface.md section 3
# (https://github.com/libreflip/serif/pull/37). Procedure for certificates, NTP
# and scanner onboarding: docs/operations.md, "libreflip scanner deployment".
#
# Install next to book-scanner.conf, which defines the `book_scanner_asgi`
# upstream used here (point it at 127.0.0.1:8000 on a single host). Then bind
# book-scanner.conf's plain-HTTP `listen 8080` to 127.0.0.1 or delete that
# server block; it refuses /api/scanner/ either way.
#
# Placeholders, all marked REPLACE:
#   serif.lan.example               the VM's LAN host name; must match the
#                                   certificate's subjectAltName
#   /etc/ssl/serif/serif.{crt,key}  certificate and key from the internal CA
#   allow lines                     FAIL CLOSED: as shipped, both servers only
#                                   `deny all`, so every client gets 403 until
#                                   the LAN ranges are added above `deny all;`
#                                   (the commented lines are RFC 5737
#                                   documentation ranges, not real networks)
#
# Also required: Uvicorn on 127.0.0.1 only (deploy/systemd/book-scanner-web.service)
# and BOOK_SCANNER_SECURE_PROXY_SSL_HEADER=true, so Django trusts the
# X-Forwarded-Proto set below; without it the production HTTPS redirect loops.
#
# CI checks this file with `nginx -t`; scripts/test_scanner_tls_proxy.sh runs it
# against a live nginx (TLS 1.2 refused, 403 outside the allowed ranges, 413
# above 64 MiB on /api/scanner/).

# Plain HTTP for browsers: redirect to HTTPS. The device API is refused rather
# than redirected; sans never sends its key over http:// or follows a redirect.
server {
    listen 80;
    server_name serif.lan.example;                  # REPLACE
    server_tokens off;

    # allow 192.0.2.0/24;                           # REPLACE: LAN range(s)
    # allow 198.51.100.0/24;                        # REPLACE
    deny all;

    location /api/scanner/ {
        return 403;
    }

    # `return` runs before allow/deny, so a plain `return 301` would answer
    # hosts outside the LAN too. try_files runs after the access check; the
    # file never exists, so every allowed request ends in the redirect.
    location / {
        try_files /.serif-redirect-only @https;
    }

    location @https {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name serif.lan.example;                  # REPLACE
    server_tokens off;

    ssl_certificate /etc/ssl/serif/serif.crt;       # REPLACE if stored elsewhere
    ssl_certificate_key /etc/ssl/serif/serif.key;   # REPLACE if stored elsewhere
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:serif_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # allow 192.0.2.0/24;                           # REPLACE: LAN range(s)
    # allow 198.51.100.0/24;                        # REPLACE
    deny all;

    # Member uploads through the web UI, as in book-scanner.conf
    # (keep in line with BOOK_SCANNER_MAX_UPLOAD_BYTES).
    client_max_body_size 150m;

    # Scanner device API: one page image per request (max_image_bytes,
    # 50 MiB by default) plus multipart overhead.
    location /api/scanner/ {
        client_max_body_size 64m;
        proxy_pass http://book_scanner_asgi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /static/ {
        alias /srv/book-scanner/static/;
        access_log off;
        add_header Cache-Control "public, max-age=60";
    }

    # Cover thumbnails (#28), carried over from book-scanner.conf. Django checks
    # the session and permissions, then answers with
    # X-Accel-Redirect: /_protected/cover-thumbnails/<path> when
    # BOOK_SCANNER_COVER_THUMBNAIL_ACCEL_PREFIX=/_protected/cover-thumbnails/ is set.
    # `internal` makes it unreachable from outside; the alias must be the
    # directory of BOOK_SCANNER_COVER_THUMBNAIL_ROOT.
    location /_protected/cover-thumbnails/ {
        internal;
        alias /var/lib/book-scanner/cover-thumbnails/;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    # Unbuffered ScanTailor event stream, carried over from book-scanner.conf.
    # Job IDs are UUIDs (web jobs) or YYYYMMDDTHHMMSSZ[-N] (scanner jobs);
    # quoted because of the {n} quantifiers.
    location ~ "^/scan/jobs/(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[0-9]{8}T[0-9]{6}Z(?:-[1-9][0-9]{0,3})?)/workspace/events/$" {
        proxy_pass http://book_scanner_asgi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_pass_header X-Accel-Buffering;
    }

    location / {
        proxy_pass http://book_scanner_asgi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
