name: book-scanner-integration

services:
  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: book_scanner_integration
      POSTGRES_USER: book_scanner
      POSTGRES_PASSWORD: book_scanner_integration
    ports:
      - "${BOOK_SCANNER_INTEGRATION_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U book_scanner -d book_scanner_integration
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${BOOK_SCANNER_INTEGRATION_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  openldap:
    image: ghcr.io/rroemhild/docker-test-openldap:master@sha256:c21d77472eaa195b3c0c2c6053266c9aede80f6290d0aca784b25f1ffe1ee197
    ports:
      - "${BOOK_SCANNER_INTEGRATION_LDAP_PORT:-55389}:10389"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ldapsearch -x -H ldap://127.0.0.1:10389
          -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone
          -b 'dc=planetexpress,dc=com' -s base '(objectClass=*)' dn
          >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 30

  proxy:
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BOOK_SCANNER_INTEGRATION_PROXY_PORT:-58080}:8080"
    volumes:
      - ./deploy/nginx/integration.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/staticfiles:/srv/book-scanner/static:ro
