{% comment %}Front cover thumbnail or letter placeholder. Context: book (title, cover_image), size ("small" or "medium").{% endcomment %}
{% if book.cover_image %}<img class="cover-thumb{% if size == 'small' %} small{% endif %}" src="{% if size == 'small' and book.cover_image.small_src %}{{ book.cover_image.small_src }}{% else %}{{ book.cover_image.src }}{% endif %}"{% if book.cover_image.srcset %} srcset="{{ book.cover_image.srcset }}" sizes="{% if size == 'small' %}70px{% else %}(max-width: 560px) 110px, 150px{% endif %}"{% endif %} width="{{ book.cover_image.width }}" height="{{ book.cover_image.height }}" alt="Front cover of {{ book.title }}" loading="lazy" decoding="async">{% else %}<div class="cover-placeholder{% if size == 'small' %} small{% endif %}" aria-hidden="true">{{ book.title|slice:":1" }}</div>{% endif %}
