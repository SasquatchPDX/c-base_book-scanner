[project]
name = "ebook-server"
version = "0.1.0"
description = "Hackerspace e-book server: shared library, ingestion, metadata identification, and ScanTailor-Web scanning pipeline"
authors = [
  { name = "SasquatchPDX", email = "sasquatchpdx@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
  "Django>=5.1.9,<6.0",
  "djangorestframework>=3.15.2,<4.0",
  "dj-database-url>=3.0.1,<4.0",
  "isbnlib>=3.10.10,<3.11",
  "rapidfuzz>=3.13.0,<4.0",
  "httpx>=0.28.1",
  "redis>=5.2.1,<6.0",
  "rq>=2.0.0,<2.1",
  "structlog>=25.1.0,<26.0",
  "pydantic>=2.10.4,<3.0",
  "pydantic-settings>=2.8.0,<3.0",
  "pillow==10.4.0",
]

[project.scripts]
ebook-server = "ebook_server.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "coverage>=7.7.0",
  "mypy>=2.3.0",
  "pytest>=9.1.1",
  "pytest-django>=4.10.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.16.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ebook_server.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--reuse-db"

[tool.coverage.run]
branch = true
source = ["ebook_server"]

[tool.coverage.report]
show_missing = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
exclude = '^.*/core/migrations/.*$'
disable_error_code = ["misc", "no-any-return"]
