name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install dependencies
        run: |
          uv sync --frozen
          npm ci
      - name: Frontend
        run: |
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high
          git diff --exit-code -- src/ebook_server/core/static/core/dist
      - name: Observability assets
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/prometheus/scrape.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/prometheus/alerts.yml:/etc/prometheus/rules/book-scanner-alerts.yml:ro" \
            -v /dev/null:/etc/prometheus/secrets/book-scanner-metrics-token:ro \
            prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 \
            check config /etc/prometheus/prometheus.yml
      - name: Reverse-proxy configuration
        run: |
          docker run --rm --add-host book-scanner-web:127.0.0.1 \
            -v "$PWD/deploy/nginx/book-scanner.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752 \
            nginx -t
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type check
        run: uv run mypy src tests
      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py collectstatic --noinput --dry-run --verbosity 0
      - name: Production configuration check
        env:
          BOOK_SCANNER_ENVIRONMENT: production
          BOOK_SCANNER_SECRET_KEY: ci-only-production-shaped-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          BOOK_SCANNER_ALLOWED_HOSTS: '["library.example.test"]'
          BOOK_SCANNER_DATABASE_URL: postgresql://ci:ci@database.example.test/library
          BOOK_SCANNER_REDIS_URL: redis://redis.example.test:6379/0
          BOOK_SCANNER_LDAP_MODE: ldap
          BOOK_SCANNER_SECURE_SSL_REDIRECT: "true"
          BOOK_SCANNER_SESSION_COOKIE_SECURE: "true"
          BOOK_SCANNER_CSRF_COOKIE_SECURE: "true"
          BOOK_SCANNER_SECURE_HSTS_SECONDS: "31536000"
          BOOK_SCANNER_SECURE_HSTS_PRELOAD: "true"
          BOOK_SCANNER_METRICS_BEARER_TOKEN: ci-only-monitoring-token
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Test
        run: uv run pytest -q

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install dependencies
        run: |
          uv sync --frozen
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install --yes libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: PostgreSQL, Redis/RQ, LDAP, ASGI, and browser integration
        run: ./scripts/run_infrastructure_tests.sh
